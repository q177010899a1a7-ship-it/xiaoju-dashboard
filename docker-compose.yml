version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiaoju-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - REFRESH_INTERVAL=1800
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK:-}
      - WECOM_WEBHOOK=${WECOM_WEBHOOK:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - xiaoju-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xiaoju-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - xiaoju-network

networks:
  xiaoju-network:
    driver: bridge
